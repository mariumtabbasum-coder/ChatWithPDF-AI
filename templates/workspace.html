<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace · ChatWithPDF AI</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/css/style.css"><link rel="stylesheet" href="/static/css/workspace.css"></head><body><nav class="topbar"><a class="brand" href="/"><span class="brand-mark">C</span><span>ChatWithPDF <small>AI</small></span></a><button class="menu-toggle" id="menuToggle" aria-label="Open navigation"><span></span><span></span><span></span></button><div class="navlinks" id="navLinks"><a href="/">Overview</a><a href="/#library">Library</a><a href="/#search">Semantic Search</a><a href="/#actions">AI Actions</a><a href="/#about">About</a></div></nav><main class="workspace-page"><div class="workspace-header"><a href="/" class="back-link">← Library</a><div><p class="eyebrow">DOCUMENT WORKSPACE</p><h1 id="docTitle">Loading document...</h1></div><div class="workspace-actions"><button id="summaryBtn" class="btn-outline-custom">✧ Summary</button><button id="actionMenuBtn" class="btn-primary-custom">AI Actions</button></div></div><div class="workspace-grid"><section class="reader-panel"><div class="panel-head"><span>Document preview</span><div class="reader-tools"><button id="prevPage">←</button><span id="pageIndicator">1 / 1</span><button id="nextPage">→</button></div></div><div class="pdf-stage" id="pdfStage"><div id="pdfFallback">Loading PDF preview...</div><canvas id="pdfCanvas"></canvas></div></section><section class="chat-panel"><div class="chat-head"><div><strong>AI Assistant</strong><small>Grounded in your document</small></div><button id="newChatBtn" class="btn-outline-custom">+ New chat</button></div><div class="suggestions" id="suggestions"><button>Summarize this document</button><button>What are the key concepts?</button><button>Explain this simply</button></div><div class="messages" id="messages"><div class="welcome-message"><div class="welcome-spark">✧</div><h3>Ask your document</h3><p>Questions, summaries and explanations — with sources.</p></div></div><form class="chat-form" id="chatForm"><textarea id="chatInput" rows="1" placeholder="Ask something about this PDF..."></textarea><button type="submit" aria-label="Send message">↑</button></form></section></div><div class="action-modal" id="actionModal"><div class="action-modal-inner"><div class="modal-top"><h2>Document actions</h2><button id="closeActionModal">×</button></div><div class="action-choice-grid"><button data-action="summary">Summary</button><button data-action="notes">Study notes</button><button data-action="quiz">Quiz</button><button data-action="flashcards">Flashcards</button><button data-action="key-points">Key points</button><button data-action="definitions">Definitions</button><button data-action="checklist">Checklist</button><button data-action="explain">Explain a topic</button></div><input id="actionExtra" placeholder="Optional: topic, quiz count, difficulty..."/><button class="btn-primary-custom" id="runAction">Generate</button></div></div><div id="actionOutput" class="action-output" hidden><div class="output-head"><h2 id="outputTitle">Result</h2><button id="closeOutput">×</button></div><div id="outputContent"></div></div></main><div id="toast" class="toast-message"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="/static/js/workspace.js"></script></body></html>
